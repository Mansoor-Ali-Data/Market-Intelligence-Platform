[project]
name = "ingestion-dlt"
version = "0.1.0"
description = "Production-oriented eBay API ingestion layer built with DLTHub and Google Cloud Storage"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "deltalake>=1.6.3",
    "dlt[gs]>=1.28.1",
    "numpy>=2.2,<2.3",
    "pandas>=2.2,<2.3",
    "pyarrow>=25.0.1",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "ruamel-yaml>=0.19.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]