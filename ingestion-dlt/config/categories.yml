# ============================================================================
# Search Domain Configuration
# ============================================================================
# Purpose:
#   Defines the business/search domains, subcategories, and search expressions
#   used during eBay Browse API ingestion.
#
# IMPORTANT:
#   These are OUR search domains.
#   They are NOT eBay's official category hierarchy.
#
#   eBay's actual category classification is taken from the API response
#   and preserved for downstream Bronze/Silver processing.
#
#
# Notes:
#   id         : Stable machine identifier
#   name       : Human-readable name
#   enabled    : Enable/disable ingestion
#   priority   : Controls ingestion order
#   search     : eBay Browse API search expression
# ============================================================================

categories:

  # ==========================================================================
  # 1. MOTORS
  # ==========================================================================

  - id: motors
    name: Motors
    enabled: true
    priority: 1

    subcategories:

      - id: parts_accessories
        name: Parts & Accessories
        enabled: true
        priority: 1
        queries:
          - id: auto_parts
            name: Auto Parts
            enabled: true
            priority: 1
            search: "(auto parts, car parts)"

      - id: cars_trucks
        name: Cars & Trucks
        enabled: true
        priority: 2
        queries:
          - id: cars_trucks
            name: Cars & Trucks
            enabled: true
            priority: 1
            search: "(car, cars, truck, trucks)"

      - id: motorcycles
        name: Motorcycles
        enabled: true
        priority: 3
        queries:
          - id: motorcycle
            name: Motorcycle
            enabled: true
            priority: 1
            search: "(motorcycle, motorbike)"

      - id: other_vehicles
        name: Other Vehicles
        enabled: true
        priority: 4
        queries:
          - id: vehicle
            name: Other Vehicles
            enabled: true
            priority: 1
            search: "(vehicle, scooter, atv)"


