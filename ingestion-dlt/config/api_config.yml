# ============================================================================
# eBay Browse Search API Configuration
# ============================================================================

api:

  # --------------------------------------------------------------------------
  # Endpoint
  # --------------------------------------------------------------------------

  base_url: "https://api.ebay.com"
  endpoint: "/buy/browse/v1/item_summary/search"
  method: "GET"

  marketplace_id: "EBAY_US"

  default_limit: 200

  paginator: offset

  data_selector: itemSummaries

  sort: "newlyListed"


  # --------------------------------------------------------------------------
  # Browse Search Filters
  # --------------------------------------------------------------------------

  filter:

    # Runtime values are injected by the ingestion pipeline.
    #
    # Example:
    #
    # itemStartDate:[2026-08-13T00:00:00Z..2026-08-14T00:00:00Z]
    #
    item_start_date: "itemStartDate:[{window_start}..{window_end}]"


  # --------------------------------------------------------------------------
  # API Parameter Mapping
  # --------------------------------------------------------------------------

  parameters:

    search: "q"
    limit: "limit"
    offset: "offset"
    filter: "filter"


# ----------------------------------------------------------------------------
# OAuth Authentication Configuration
# ----------------------------------------------------------------------------

authentication:

  type: ebay_oauth

  access_token_url: "https://api.ebay.com/identity/v1/oauth2/token"

  grant_type: client_credentials

  scope: https://api.ebay.com/oauth/api_scope

  token_expiration: 7200


# ----------------------------------------------------------------------------
# dlt Pipeline Configuration
# ----------------------------------------------------------------------------

pipeline:

  pipeline_name: "ebay_browse_ingestion"

  dataset_name: "ebay"